spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/profile_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

eureka:
  client:
    enabled: false
