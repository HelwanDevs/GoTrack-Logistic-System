spring:
  application:
    name: branch-service

  datasource:
    url: jdbc:postgresql://localhost:5432/branch_service_db
    username: postgres
    password: branch123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.hibernate.SQL: debug

