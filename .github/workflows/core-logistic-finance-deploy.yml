name: Deploy Core Logistic Finance Service

on:
  workflow_dispatch:
  push:
    paths:
      - "core-logistic-finance/**"
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CORE_LOGISTIC_FINANCE_EC2_HOST }}
          username: ${{ secrets.API_GATEWAY_EC2_USER }}
          key: ${{ secrets.API_GATEWAY_EC2_SSH_KEY }}

          script: |
            set -e

            echo "📦 Pull latest code"
            cd ~/GoTrack-Logistic-System
            git pull origin main

            echo "🔐 Fetch JWT keys from SSM"
            mkdir -p core-logistic-finance/keys

            aws ssm get-parameter \
              --name "/gotrack/jwt/gateway/public" \
              --with-decryption \
              --query Parameter.Value \
              --output text > core-logistic-finance/keys/gateway_public_key.pem

            echo "🧹 Remove old container"
            docker rm -f core-logistic-finance || true

            echo "🏗️ Build image"
            docker build -t core-logistic-finance ./core-logistic-finance/

            echo "🚀 Run container"
            export $(cat .env | xargs)

            docker run -d \
              --env-file .env \
              --restart unless-stopped \
              -p "${SERVER_PORT}:${SERVER_PORT}" \
              --name core-logistic-finance \
              --log-driver=awslogs \
              --log-opt awslogs-region=eu-central-1 \
              --log-opt awslogs-group=gotrack-prod \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=core-logistic-finance \
              core-logistic-finance