server:
  port: 8080


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: auth-service
            uri: lb://auth-service
            
            predicates:
              - Path=/auth/**
            filters:
              - AddRequestHeader=X-Gateway, Dynamic


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/