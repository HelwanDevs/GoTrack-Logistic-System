services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: gotrack-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: auth_db
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - gotrack-network
    # healthcheck:
    #   test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 20s

  # Service Discovery (Eureka)
  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    container_name: service-discovery
    ports:
      - '8761:8761'
    environment:
      - SPRING_APPLICATION_NAME=service-discovery
      - SERVER_PORT=8761
    networks:
      - gotrack-network
    depends_on:
      - mongodb
    # healthcheck:
    #   test: curl -f http://localhost:8761/eureka/apps || exit 1
    #   interval: 15s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - '8081:8081'
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SERVER_PORT=8081
      - SPRING_DATA_MONGODB_URI=mongodb://root:secret@mongodb:27017/auth_db?authSource=admin
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - JWT_SECRET=your_jwt_secret_key
      - JWT_EXPIRATION=86400000
    depends_on:
      - mongodb
        # condition: service_healthy
      - service-discovery
        # condition: service_healthy
    networks:
      - gotrack-network
    # healthcheck:
    #   test: curl -f http://localhost:8081/actuator/health || exit 1
    #   interval: 15s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - '8080:8080'
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
        # condition: service_healthy
    networks:
      - gotrack-network
    # healthcheck:
    #   test: curl -f http://localhost:8080/actuator/health || exit 1
    #   interval: 15s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s

networks:
  gotrack-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
