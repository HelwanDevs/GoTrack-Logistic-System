services:
  mongodb:
    image: 'mongo:latest'
    container_name: auth-db
    environment:
      - MONGO_INITDB_DATABASE=auth_db
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_INITDB_ROOT_USERNAME=root
    ports:
      - '27017:27017'

  auth-service:
    build: .
    container_name: auth-service-app
    ports:
      - '8081:8081'
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:secret@mongodb:27017/auth_db?authSource=admin