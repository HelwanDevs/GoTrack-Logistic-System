services:
  mongodb:
    image: 'mongo:latest'
    container_name: auth-database
    environment:
      - MONGO_INITDB_DATABASE=auth_db
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_INITDB_ROOT_USERNAME=root
    ports:
      - '27017:27017'
    networks:
      - auth-network
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - '8080:8080'
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:secret@auth-database:27017/auth_db?authSource=admin
    volumes:
      - ~/.m2:/root/.m2
    networks:
      - auth-network
      
networks:
  auth-network:
    driver: bridge